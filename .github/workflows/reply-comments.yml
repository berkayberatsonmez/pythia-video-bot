name: Pythia IG Yorum Yanıtla

# Instagram yorumlarına otomatik yanıt (scripts/reply-comments.ts).
# Remotion/render YOK → hafif iş, Chrome bağımlılığı gerekmiyor.
#
# Zamanlama (UTC, TR = UTC+3): video slotlarıyla çakışmasın diye araya alındı.
#   12:20 → öğleden sonra turu   ·   20:20 → akşam turu
# Bu repoda cron gecikebiliyor (bkz. daily-video.yml notu); sorun değil,
# script zaten cevaplanmış yorumları API'den görüp atlıyor.
# ⚠️ CRON KAPALI — Facebook Login rotasına geçildi (IG_PAGE_TOKEN, graph.facebook.com;
# 2026-10-28'de yorum metinlerinin okunduğu doğrulandı). Bir insan manuel
# kuru çalıştırmanın (dry=true) çıktısını kontrol etmeden zamanlama AÇILMAZ.
# Açmak için aşağıdaki schedule bloğunun yorumunu kaldır.
#
# on:
#   schedule:
#     - cron: "20 12 * * *"
#     - cron: "20 20 * * *"
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Kuru çalıştırma (hiçbir yanıt gönderilmez, sadece ne yapacağını yazar)"
        type: boolean
        default: true
      debug:
        description: "Teşhis modu (medya listesi + ham API cevabı yazdırılır)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Yorumları yanıtla
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: |
          # Manuel tetiklemede varsayılan KURU; cron'da her zaman gerçek gönderim.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            npm run reply:comments          # cron → her zaman gerçek gönderim
          elif [ "${{ inputs.debug }}" = "true" ]; then
            npm run reply:debug             # teşhis (her zaman kuru)
          elif [ "${{ inputs.dry }}" = "true" ]; then
            npm run reply:dry
          else
            npm run reply:comments
          fi
