name: Pythia IG Yorum Yanıtla

# Instagram yorumlarına otomatik yanıt (scripts/reply-comments.ts).
# Remotion/render YOK → hafif iş, Chrome bağımlılığı gerekmiyor.
#
# Zamanlama: 2 saatte bir, 05:00-21:00 UTC (TR 08:00-24:00); cron "17 5-21/2 * * *".
# GitHub cron'u yoğun saatlerde gecikebilir (dakikalar, bazen daha fazla); sorun değil,
# script cevaplanmış yorumları API'den görüp atlıyor. Zamanlanmış koşular GERÇEK gönderir;
# manuel tetiklemede dry varsayılan true.
on:
  schedule:
    - cron: "17 5-21/2 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Kuru çalıştırma (hiçbir yanıt gönderilmez, sadece ne yapacağını yazar)"
        type: boolean
        default: true
      debug:
        description: "Teşhis modu (medya listesi + ham API cevabı yazdırılır)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Yorumları yanıtla
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # Manuel tetiklemede varsayılan KURU; cron'da her zaman gerçek gönderim.
          {
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            npm run reply:comments          # cron → her zaman gerçek gönderim
          elif [ "${{ inputs.debug }}" = "true" ]; then
            npm run reply:debug             # teşhis (her zaman kuru)
          elif [ "${{ inputs.dry }}" = "true" ]; then
            npm run reply:dry
          else
            npm run reply:comments
          fi
          } 2>&1 | tee reply-out.txt
      - name: Özet (kullanıcı adları gizli)
        if: always()
        run: |
          # Repo herkese açık: kullanıcı adları maskelenir, tek bir notice'e sığdırılır
          # (loglar API'den okunamıyor; özet check-run annotation'ından okunur).
          [ -f reply-out.txt ] || exit 0
          python3 - <<'PY'
          import re
          keep = ("👤", "📸", "💬", "↳", "⏭️", "🚨", "⚠️", "✅", "Toplam", "toplam", "HATA", "HTTP")
          lines = [l.rstrip() for l in open("reply-out.txt", encoding="utf-8") if any(k in l for k in keep)]
          lines = [re.sub(r"@[A-Za-z0-9_.]+", lambda m: m.group(0) if m.group(0) == "@pythiamystic" else "@***", l) for l in lines]
          body = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in lines)[:12000]
          print(f"::notice title=Yorum botu özeti::{body or 'çıktı yok'}")
          PY
