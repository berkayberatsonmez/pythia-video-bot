name: Pythia TikTok Auto (PostPeer, 2 günde bir)

# TAM-OTOMATİK TikTok postu, PostPeer (onaylı aracı) üzerinden. Kendi Direct Post
# başvurumuz politika gerekçesiyle reddedildi → yayın PostPeer API'siyle yapılır.
# Render Actions'ta (Remotion) → Release'e paketle (PUBLIC repo → asset token'sız
# indirilir) → PostPeer'e {caption + public mp4 URL} POST et; PostPeer videoyu
# kendisi çekip TikTok'a postlar.
#
# Worker /publish + cron-auth koda DOKUNULMADI (artık ÇAĞRILMIYOR; panel yolu durur).
# daily-video.yml'e (IG/YT) ve tiktok-demo.yml'e DOKUNMAZ — ayrı, bağımsız cron.
#
# KOTA: PostPeer ücretsiz plan 20 post/ay → cron 2 GÜNDE BİR (tek günler, max 16/ay).
# ⚠️ GitHub cron bu repoda gecikebilir (~4-5 sa); post zaman-hassas değil, tolere edilir.
on:
  schedule:
    - cron: "0 9 */2 * *" # UTC 09:00, 2 günde bir (tek günler) = TR 12:00
  workflow_dispatch: {} # elle tetik

permissions:
  contents: write # gh release create/upload + dedup marker

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Chrome bağımlılıkları (Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            fonts-noto-color-emoji
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Remotion tarayıcısını hazırla
        run: npx remotion browser ensure

      - name: Bugünün klibini seç (rotasyon — deterministik, gün bazlı)
        id: pick
        run: |
          PICK=$(npx tsx scripts/tiktok-pick-today.ts)
          echo "picked: $PICK"
          echo "comp=$(echo "$PICK" | jq -r .comp)"         >> "$GITHUB_OUTPUT"
          echo "propKey=$(echo "$PICK" | jq -r .propKey)"   >> "$GITHUB_OUTPUT"
          echo "category=$(echo "$PICK" | jq -r .category)" >> "$GITHUB_OUTPUT"
          echo "id=$(echo "$PICK" | jq -r .id)"             >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)"                    >> "$GITHUB_OUTPUT"

      - name: Kompozisyonu render et (MEVCUT hat — voiceover'sız)
        run: |
          mkdir -p out/tiktok
          echo "{ \"${{ steps.pick.outputs.propKey }}\": \"${{ steps.pick.outputs.id }}\", \"tiktokClean\": true }" > props.json
          npx remotion render src/index.ts "${{ steps.pick.outputs.comp }}" out/tiktok/_raw.mp4 --props=props.json

      - name: Native caption + panel asset'lerine paketle
        id: pack
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/tiktok/_raw.mp4 2>/dev/null | cut -d. -f1)
          npx tsx scripts/render-tiktok-demo.ts \
            --in out/tiktok/_raw.mp4 \
            --category "${{ steps.pick.outputs.category }}" \
            --id "${{ steps.pick.outputs.id }}" \
            --duration "${DUR:-0}"
          rm -f out/tiktok/_raw.mp4
          echo "tag=pythia-auto-${{ steps.pick.outputs.date }}"                 >> "$GITHUB_OUTPUT"
          echo "format=${{ steps.pick.outputs.category }}-${{ steps.pick.outputs.id }}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release'e yayınla (Worker /publish bunu okur)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pack.outputs.tag }}"
          gh release create "$TAG" out/tiktok/*.mp4 out/tiktok/*.meta.json out/tiktok/*.caption.txt \
            --title "Pythia TikTok auto ${{ steps.pick.outputs.date }}" \
            --notes "Otomatik TikTok postu — public mp4 asset'ini PostPeer çeker." \
          || gh release upload "$TAG" out/tiktok/*.mp4 out/tiktok/*.meta.json out/tiktok/*.caption.txt --clobber

      - name: TikTok'a PostPeer ile yayınla (Worker /publish YERİNE)
        env:
          POSTPEER_API_KEY: ${{ secrets.POSTPEER_API_KEY }}
          POSTPEER_ACCOUNT_ID: ${{ secrets.POSTPEER_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pack.outputs.tag }}"
          FORMAT="${{ steps.pack.outputs.format }}"
          REPO="${{ github.repository }}"
          VIDEO_URL="https://github.com/$REPO/releases/download/$TAG/$FORMAT.mp4"
          CAPTION="$(cat "out/tiktok/$FORMAT.caption.txt")"

          # ── DEDUP GUARD (Worker KV yerine Release marker; tag=gün → çift-post kes) ──
          if gh release view "$TAG" --repo "$REPO" --json assets \
               -q '.assets[].name' | grep -qx 'posted.tiktok.marker'; then
            echo "✓ dedup: $TAG zaten postlanmış (marker var) — atla."; exit 0
          fi

          post_once () {   # $1 = draft(true|false) → stdout: HTTP kodu; gövde /tmp/pp.json, başlık /tmp/pp.head
            jq -n --arg c "$CAPTION" --arg u "$VIDEO_URL" \
                  --arg a "$POSTPEER_ACCOUNT_ID" --argjson d "$1" \
              '{content:$c, mediaItems:[{url:$u,type:"video"}],
                platforms:[{platform:"tiktok",accountId:$a,
                            platformSpecificData:{draft:$d}}]}' > /tmp/pp.body.json
            # Ağ hatasında curl 000 yazar ama non-zero döner → set -e'yi tetiklemesin
            # ('|| true' ile fonksiyon 0 döner, döngü 000'ı görüp retry eder).
            curl -sS -o /tmp/pp.json -D /tmp/pp.head -w "%{http_code}" \
              -X POST "https://api.postpeer.dev/v1/posts" \
              -H "Content-Type: application/json" \
              -H "x-access-key: $POSTPEER_API_KEY" \
              --data @/tmp/pp.body.json || true
          }

          log_rate () {  # Yanıt yalnız DAKİKALIK istek limitini döndürüyor (aylık kredi YOK) → onu logla
            grep -iE '^x-ratelimit-(limit|remaining|reset):' /tmp/pp.head 2>/dev/null || true
          }

          # Retry 2 deneme (kredi tüketimini sınırla: en kötü 2 public + 1 draft = 3 istek/run).
          OK=""; DRAFT=""
          for i in 1 2; do
            HTTP=$(post_once false); echo "attempt $i → HTTP $HTTP"; cat /tmp/pp.json; echo; log_rate
            case "$HTTP" in
              2*)         OK=1; break;;                                    # kabul
              429|5*|000) S=$((i*20)); echo "geçici ($HTTP) — ${S}s bekle"; sleep $S;;
              *)          echo "✗ kalıcı hata ($HTTP) — retry yok"; break;;  # 400/401/403
            esac
          done

          # ── Son çare: public başarısızsa DRAFT gönder (hiç postlamamaktansa) ──
          if [ -z "$OK" ]; then
            echo "public post başarısız — draft:true deniyorum"
            HTTP=$(post_once true); echo "draft → HTTP $HTTP"; cat /tmp/pp.json; echo; log_rate
            case "$HTTP" in 2*) OK=1; DRAFT=1;; *) echo "✗ draft de başarısız ($HTTP)"; exit 1;; esac
          fi

          # ── Başarı → dedup marker'ı Release'e yaz (aynı gün tekrar denemesin) ──
          # Marker BOŞ OLMAMALI: GitHub asset upload boş dosyayı 400 (Bad Content-Length)
          # ile reddeder → içerik yaz (postId varsa ekle, yoksa tarih yeter).
          POST_ID=$(jq -r '(.postId // .id // .data.postId // empty)' /tmp/pp.json 2>/dev/null || true)
          printf 'posted %s postId=%s\n' "$(date -u +%FT%TZ)" "${POST_ID:-?}" > /tmp/posted.tiktok.marker
          # Marker upload başarısız olsa POST ZATEN GİTTİ → job'ı KIRMIZIYA DÜŞÜRME;
          # yalnız uyarı bırak (exit 1 yanıltıcı olurdu).
          if ! gh release upload "$TAG" /tmp/posted.tiktok.marker --repo "$REPO" --clobber; then
            MMSG="dedup marker yüklenemedi ($TAG) — TikTok postu BAŞARILI, job yeşil; marker olmadan aynı gün tekrar tetiklenirse çift-post riski"
            echo "::warning::$MMSG"
            echo "⚠️ $MMSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$DRAFT" ]; then
            # SESSİZ DEĞİL: marker yazıldı (çift-post yok) AMA Actions'ta sarı uyarı bırak.
            MSG="TikTok public post başarısız, DRAFT olarak gönderildi — TikTok uygulamasından elle yayınla ($TAG / $FORMAT)"
            echo "::warning::$MSG"
            echo "⚠️ $MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "✓ DRAFT gönderildi (PostPeer) + marker yazıldı."
          else
            echo "✓ TikTok'a gönderildi (PostPeer) + marker yazıldı."
          fi
