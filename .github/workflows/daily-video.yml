name: Pythia Günlük Video

# 3 zamanlı cron (UTC): 03:41 YouTube yükle (1 video/gün — sabah slot, 13:00 TR zamanlı; retention için az/kaliteli),
# 10:07 Instagram sabah Reels, 18:07 Instagram akşam Reels. (TR = UTC+3, DST yok)
# TikTok: IG slotlarıyla birlikte drafts'a yüklenir — telefondan tek tıkla yayınla (TikTok video.upload kuralı).
on:
  schedule:
    # GitHub cron'u bu repoda ~4-5 saat gecikiyor (garip dakika bile çözmedi).
    # IG için DAKİK zamanlama: cron-job.org → repository_dispatch (aşağıda).
    # Aşağıdaki cron'lar YEDEK — geç de olsa atsınlar; dedup mükerreri engeller.
    - cron: "41 3 * * *" # YouTube (1 video/gün, sabah slot — server-side 13:00 yayınlar)
    - cron: "7 10 * * *" # IG sabah (yedek)
    - cron: "7 18 * * *" # IG akşam (yedek)
  repository_dispatch: # cron-job.org dış tetiği — DAKİK IG zamanlaması (asıl yol)
    types: [ig-morning, ig-evening]
  workflow_dispatch: # Actions sekmesinden manuel tetikleme
    inputs:
      mode:
        description: "Ne yayınlansın?"
        type: choice
        options:
          - both
          - instagram
          - youtube
          - tiktok
          - commenttest
        default: both

permissions:
  contents: write # gh release (IG video hosting) için gerekli

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Chrome bağımlılıkları (Remotion render için)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            fonts-noto-color-emoji
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Bağımlılıkları kur
        id: deps
        run: npm ci

      - name: Remotion tarayıcısını hazırla
        run: npx remotion browser ensure

      # Güncel konu girdisi (opsiyonel): Google Trends TR RSS. 10 sn zaman aşımı, hata TOLERE edilir —
      # alınamazsa dosya yazılmaz ve topical.ts trend olmadan (gök + takvim + evergreen) devam eder.
      # scripts/topical.ts yalnız astro/tarot/rüya sözlüğüne uyan terimi kullanır; dosya 18 saatten eskiyse yok sayar.
      - name: Google Trends TR (opsiyonel, hata tolere edilir)
        continue-on-error: true
        run: |
          mkdir -p out/trends
          rm -f out/trends/google-tr.rss out/trends/google-tr.rss.tmp
          if curl -fsSL --max-time 10 --retry 0 -A "Mozilla/5.0 (compatible; PythiaBot/1.0)" \
               "https://trends.google.com/trending/rss?geo=TR" -o out/trends/google-tr.rss.tmp \
             && grep -q "<rss" out/trends/google-tr.rss.tmp; then
            mv out/trends/google-tr.rss.tmp out/trends/google-tr.rss
            echo "✓ Trend RSS alındı ($(grep -o '<item' out/trends/google-tr.rss | wc -l) öğe)"
          else
            echo "::warning::Google Trends alınamadı — trend girdisi olmadan devam ediliyor"
            rm -f out/trends/google-tr.rss.tmp
          fi
          exit 0

      - name: Google kimlik bilgilerini yaz (base64 secrets'tan)
        run: |
          mkdir -p scripts
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 -d > scripts/credentials.json
          echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > scripts/token.json
          node -e "JSON.parse(require('fs').readFileSync('scripts/credentials.json','utf8')); JSON.parse(require('fs').readFileSync('scripts/token.json','utf8')); console.log('✓ JSON geçerli')"

      - name: Render + yükle (YouTube zamanlı + Instagram Reels)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            ACTION="${{ github.event.action }}"
            echo "▶ Dış tetik (dakik): $ACTION"
            case "$ACTION" in
              ig-morning) npm run rotation -- --instagram --slot morning ;;
              ig-evening) npm run rotation -- --instagram --slot evening ;;
              *)          echo "⚠️ Bilinmeyen dispatch ($ACTION) — atlanıyor" ;;
            esac
          elif [ "$EVENT" = "schedule" ]; then
            SCHED="${{ github.event.schedule }}"
            echo "▶ Zamanlı (GitHub cron, yedek): $SCHED"
            case "$SCHED" in
              "41 3 * * *") npm run rotation -- --upload --slot morning ;; # YT 1/gün (retention)
              "7 10 * * *") npm run rotation -- --instagram --slot morning ;;
              "7 18 * * *") npm run rotation -- --instagram --slot evening ;;
              *)            echo "⚠️ Bilinmeyen schedule ($SCHED) — atlanıyor" ;;
            esac
          else
            MODE="${{ github.event.inputs.mode }}"
            echo "▶ Manuel: $MODE"
            case "$MODE" in
              instagram)   npm run rotation -- --instagram ;;
              youtube)     npm run rotation -- --upload --slot morning ;; # YT 1/gün
              tiktok)      npm run rotation -- --tiktok --slot morning ;; # SADECE TikTok drafts (IG/YT yok) — test/manuel
              commenttest) npx tsx scripts/upload-instagram.ts --comment-test ;;
              *)           npm run rotation -- --upload --instagram ;;
            esac
          fi

      - name: Yayın kayıtlarını artifact olarak sakla
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/analytics/events.jsonl
          if-no-files-found: ignore
          retention-days: 90

      # Public depoya arşiv (bilinçli — bkz. scripts/analytics/archive.ts): yalnız public
      # post ID/URL + sayaçlar. Hata YAYINI/job'ı asla kırmaz (push zaten hata yutar).
      - name: Yayın kayıtlarını arşivle (video-observability release)
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run analytics:push || echo "::warning::analytics arşivi atlandı"
